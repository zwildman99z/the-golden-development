<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>HEAVY-PRO - Netlify Forms Detection</title>
</head>
<body>
  <!-- ฟอร์มลงทะเบียนสำหรับลูกค้า (เจ้าของรถแบคโฮ/รถดัมพ์) -->
  <form name="lead-generation" data-netlify="true" hidden>
    <input type="text" name="name" />
    <input type="text" name="phone" />
    <input type="number" name="trucks" />
    <input type="text" name="service-area" />
  </form>
</body>
</html>
