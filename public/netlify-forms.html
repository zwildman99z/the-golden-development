<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Makro-Click - Netlify Forms Detection</title>
</head>
<body>
  <!-- ฟอร์มติดต่อเช่าเครื่องจักรสำหรับ Makro-Click -->
  <form name="equipment-rental" data-netlify="true" hidden>
    <input type="text" name="name" />
    <input type="text" name="phone" />
    <input type="text" name="machine-type" />
    <input type="text" name="job-location" />
    <input type="date" name="date-needed" />
  </form>
</body>
</html>
